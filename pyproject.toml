[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatperezoso"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "psutil>=5.9",
    "regex>=2024.5.15",
    "google-re2>=1.1",
    "markdown>=3.5",
    "pygments>=2.17",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-qt>=4",
    "pytest-timeout>=2.3",
]

# Plugins internos del proyecto. Un plugin externo (pip install
# chatperezoso-plugin-github) aparecería automáticamente en el mismo grupo.
[project.entry-points."chatperezoso.plugins"]
git = "plugins.git:GitProvider"
search = "plugins.search:SearchProvider"
shell = "plugins.shell:ShellProvider"
verificador = "plugins.verificador:VerificadorProvider"

[tool.setuptools.packages.find]
include = ["core*", "ui*", "plugins*", "scripts*"]

[tool.pyright]
include = ["core", "ui", "plugins", "scripts", "tests"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.venv",
    "**/workspace",
    "**/.patches",
]
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
# Los tests usan fakes que no cumplen los Protocol al 100%. El código
# de producción sí es estricto.
reportPrivateUsage = false
